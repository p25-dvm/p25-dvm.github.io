site_name: The Unofficial DVMProject P25 Knowledge Base
site_description: A community operated knowledge base regarding P25 operations while utilizing the DVMProject.
site_url: https://p25-dvm.github.io

theme:
  name: material
  palette:
    scheme: slate          # dark mode — remove for light
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Reference: reference.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
